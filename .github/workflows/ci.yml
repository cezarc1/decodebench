name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Ruff format, ruff, pyright, ty (no diagnostics beyond tests/ty_baseline.txt), pytest
        run: make check
